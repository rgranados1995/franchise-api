plugins {
	id 'co.com.bancolombia.cleanArchitecture'
	id 'org.springframework.boot' apply false
    id 'org.sonarqube'
    id 'info.solidsoft.pitest'
}

ext {
    jackson2Version = '2.23.0'
    jackson3Version = '3.3.0'
    minimumCoverageRatio = 0.90
}

allprojects {
    repositories {
        mavenCentral()
    }
    dependencies {
    }
}

// Force dependency versions to address reported vulnerabilities.
dependenciesOverride {
   ensure "com.fasterxml.jackson.core:jackson-core:${jackson2Version}"
   ensure "tools.jackson.core:jackson-core:${jackson3Version}"
}

subprojects {
    // Remove once it has been updated in Spring Boot
    ext['jackson-2-bom.version'] = rootProject.jackson2Version
    ext['jackson-bom.version'] = rootProject.jackson3Version

    // Fail the build when a module's line coverage drops below the agreed minimum.
    // The bootstrap class only starts Spring, so it is left out of the ratio.
    afterEvaluate {
        tasks.withType(JacocoCoverageVerification).configureEach {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: ['**/MainApplication.class'])
            }))
            violationRules {
                rule {
                    limit {
                        counter = 'LINE'
                        minimum = rootProject.minimumCoverageRatio
                    }
                }
            }
        }
        tasks.named('check') {
            dependsOn tasks.named('jacocoTestCoverageVerification')
        }
    }
}

